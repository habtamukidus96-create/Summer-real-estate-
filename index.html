<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER HOMES | Luxury Real Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gold-text { color: #b8860b; }
        .bg-gold { background-color: #b8860b; }
        .fancy-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .fancy-table th { background-color: #b8860b; color: white; padding: 6px; border: 1px solid #ddd; }
        .fancy-table td { padding: 6px; border: 1px solid #ddd; text-align: center; }
        .fancy-table tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body class="font-sans text-gray-900">

<!-- Header -->
<nav class="fixed top-0 w-full z-50 p-6 flex justify-between items-center bg-black/90 text-white shadow-lg">
    <span class="text-2xl font-bold tracking-widest">SUMMER HOMES</span>
    <button onclick="document.getElementById('mobile-menu').classList.remove('hidden')" class="text-3xl">☰</button>
</nav>

<div id="mobile-menu" class="hidden fixed inset-0 bg-black z-[60] flex flex-col items-center justify-center text-white text-3xl gap-8" onclick="this.classList.add('hidden')">
    <a href="#home">Home</a><a href="#about">About</a><a href="#listings">Listings</a><a href="#contact">Contact</a>
</div>

<!-- Listings Section -->
<section id="listings" class="py-24 px-6 bg-gray-50">
    <h2 class="text-5xl font-bold mb-16 text-center">OUR LISTINGS.</h2>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-10 max-w-7xl mx-auto">
        <script>
            const titles = ["Executive Suite", "Premium Apartment", "Studio Suite", "Modern Flat", "Urban Home"];
            const beds = ["3", "2", "1", "3", "4"];
            const baths = ["2", "2", "1", "3", "3"];
            const sizes = ["182", "140", "80", "200", "250"];
            
            for(let i=1; i<=5; i++) {
                document.write(`
                <div class="border bg-white p-6 shadow-xl">
                    <img src="apt${i}.jpg" class="w-full h-64 object-cover mb-4">
                    <h4 class="text-2xl font-bold mb-4">${titles[i-1]}</h4>
                    
                    <div class="grid grid-cols-3 gap-2 text-center mb-4 text-xl">
                        <div><i class="fas fa-bed gold-text block mb-1"></i><span class="font-bold">${beds[i-1]}</span></div>
                        <div><i class="fas fa-bath gold-text block mb-1"></i><span class="font-bold">${baths[i-1]}</span></div>
                        <div><i class="fas fa-expand gold-text block mb-1"></i><span class="font-bold">${sizes[i-1]}m²</span></div>
                    </div>

                    <div class="flex gap-2 mb-4">
                        <a href="tel:0983796622" class="flex-1 py-2 text-center border border-black"><i class="fas fa-phone-alt"></i></a>
                        <a href="https://wa.me/251983796622" class="flex-1 py-2 text-center border border-green-600 text-green-600"><i class="fab fa-whatsapp"></i></a>
                        <a href="https://vm.tiktok.com/ZS9MHb6UN87kB-lIhAF/" class="flex-1 py-2 text-center border border-pink-500 text-pink-500"><i class="fab fa-tiktok"></i></a>
                    </div>
                    <button onclick="document.getElementById('d${i}').classList.toggle('hidden')" class="w-full py-3 bg-black text-white font-bold hover:bg-[#b8860b] transition">View Details</button>
                    <div id="d${i}" class="hidden mt-4 p-4 border border-[#b8860b]">
                        <p class="gold-text font-bold text-center">Price: 79,000 per m²</p>
                        <table class="fancy-table">
                            <thead><tr><th>Advance</th><th>Discount</th></tr></thead>
                            <tbody>
                                <tr><td>20%</td><td>13%</td></tr>
                                <tr><td>30%</td><td>15%</td></tr>
                                <tr><td>40%</td><td>17%</td></tr>
                                <tr><td>50%</td><td>19%</td></tr>
                                <tr><td>60%</td><td>20%</td></tr>
                                <tr><td>70%</td><td>21%</td></tr>
                                <tr><td>80%</td><td>22%</td></tr>
                                <tr><td>90%</td><td>24%</td></tr>
                                <tr class="bg-gold text-white font-bold"><td>100%</td><td>25%</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>`);
            }
        </script>
    </div>
</section>

</body>
</html>
