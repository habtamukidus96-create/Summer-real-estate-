<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Real Estate | Luxury Properties</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; }
        .gold-text { color: #d4af37; }
        .bg-gold { background-color: #d4af37; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body>

<nav class="flex justify-between p-6 items-center border-b border-gray-800">
    <div class="text-2xl font-bold tracking-widest">SUMMER</div>
    <div class="cursor-pointer md:hidden" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">☰</div>
    <div class="hidden md:flex gap-8">
        <a href="#home">Home</a><a href="#properties">Properties</a><a href="#gallery">Gallery</a><a href="#about">About</a><a href="#contact">Contact</a>
    </div>
</nav>

<div id="mobile-menu" class="hidden md:hidden p-6 bg-gray-900 text-center">
    <a href="#home" class="block py-4">Home</a><a href="#properties" class="block py-4">Properties</a>
    <a href="#gallery" class="block py-4">Gallery</a><a href="#about" class="block py-4">About</a>
</div>

<header id="home" class="h-[80vh] flex items-center justify-center text-center bg-cover bg-center" style="background-image: url('hero.jpg');">
    <div class="bg-black/50 p-10">
        <h1 class="text-5xl font-bold mb-4">OWN THE SKYLINE.</h1>
        <p class="mb-6">Powerful architecture. Premium living.</p>
        <button class="bg-gold text-black px-8 py-3 font-bold">Explore Properties</button>
    </div>
</header>

<section id="properties" class="p-10">
    <h2 class="text-3xl mb-10 border-l-4 border-gold pl-4">Elite Properties</h2>
    <div class="grid md:grid-cols-3 gap-8">
        <div class="bg-gray-900 p-4 border border-gray-800">
            <img src="apt1.jpg" alt="Apartment" class="w-full h-64 object-cover">
            <h3 class="text-xl mt-4">Luxury Executive Suite</h3>
            <p class="text-gray-400">3 Beds | 2 Baths | 182.64 m²</p>
            <button onclick="openModal('aptf1.jpg', 'Luxury 3 Bed Suite', '3 Beds, 2 Baths, 182.64 m²')" class="w-full mt-4 bg-gold text-black py-2 font-bold">View More Details</button>
        </div>
    </div>
</section>

<section id="gallery" class="p-10 bg-gray-900">
    <h2 class="text-3xl mb-6">Gallery</h2>
    <video class="w-full rounded shadow-lg" controls>
        <source src="showcase.mp4" type="video/mp4">
    </video>
</section>

<div id="propertyModal" class="modal">
    <div class="bg-white text-black p-6 w-[90%] max-w-lg rounded">
        <button onclick="document.getElementById('propertyModal').classList.remove('active')" class="float-right font-bold">✕</button>
        <img id="modalFloorPlan" src="" class="w-full mb-4">
        <h2 id="modalTitle" class="text-2xl font-bold"></h2>
        <p id="modalSpecs" class="my-2"></p>
        <div class="flex gap-2 mt-4">
            <a href="tel:0983796622" class="flex-1 bg-black text-white py-2 text-center">CALL</a>
            <a href="https://wa.me/251983796622" class="flex-1 bg-green-600 text-white py-2 text-center">WHATSAPP</a>
            <a href="https://t.me/yourusername" class="flex-1 bg-blue-500 text-white py-2 text-center">TELEGRAM</a>
        </div>
    </div>
</div>

<script>
    function openModal(imgSrc, title, specs) {
        document.getElementById('modalFloorPlan').src = imgSrc;
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalSpecs').innerText = specs;
        document.getElementById('propertyModal').classList.add('active');
    }
</script>

</body>
</html>
