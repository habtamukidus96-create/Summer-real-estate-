<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER HOMES | Luxury Real Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gold-text { color: #b8860b; }
        .bg-gold { background-color: #b8860b; }
        .expandable-details-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .detail-toggle-chk:checked ~ .expandable-details-content { max-height: 1000px; padding: 1rem; }
        .lbl-toggle-details { cursor: pointer; display: block; text-align: center; padding: 1rem; border: 2px solid #000; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body class="font-sans text-gray-900">

<nav class="fixed w-full bg-white z-50 p-6 flex justify-between items-center border-b shadow-sm">
    <div class="flex items-center gap-6">
        <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="text-3xl">☰</button>
        <span class="text-2xl font-bold tracking-widest gold-text">SUMMER HOMES</span>
    </div>
    <div class="hidden md:flex gap-6 text-2xl">
        <a href="https://www.facebook.com/share/1DRB4nuGMN/"><i class="fab fa-facebook"></i></a>
        <a href="https://vt.tiktok.com/ZSQXwXkve/"><i class="fab fa-tiktok"></i></a>
        <a href="https://t.me/yosephab"><i class="fab fa-telegram"></i></a>
        <a href="https://wa.me/251983796622"><i class="fab fa-whatsapp"></i></a>
    </div>
</nav>

<div id="mobile-menu" class="hidden fixed top-24 w-full bg-white z-40 p-8 text-center border-b">
    <a href="#home" class="block py-4 text-xl">Home</a>
    <a href="#about" class="block py-4 text-xl">About Us</a>
    <a href="#why-us" class="block py-4 text-xl">Why Choose Us</a>
    <a href="#listings" class="block py-4 text-xl">Listings</a>
    <a href="#gallery" class="block py-4 text-xl">Gallery</a>
</div>

<main class="pt-32 p-6 md:p-20">
    <section id="home" class="mb-20 text-center">
        <h1 class="text-6xl font-bold gold-text">SUMMER HOMES</h1>
    </section>

    <section id="about" class="mb-20 text-center max-w-4xl mx-auto">
        <h2 class="text-5xl font-bold mb-6 gold-text">About Us</h2>
        <p class="text-2xl">We curate luxury lifestyles in Addis Ababa with world-class standards.</p>
    </section>

    <section id="why-us" class="mb-20 text-center max-w-4xl mx-auto">
        <h2 class="text-5xl font-bold mb-6 gold-text">Why Choose Us</h2>
        <p class="text-2xl">Unmatched architectural integrity and white-glove service.</p>
    </section>

    <section id="listings" class="grid md:grid-cols-3 gap-10">
        <script>
            const listings = [
                {title: "Executive Suite", beds: 3, baths: 2, size: "182.64 m²", img: "apt1.jpg", plan: "aptf1.jpg"},
                {title: "Premium Apartment", beds: 3, baths: 2, size: "168.91 m²", img: "apt2.jpg", plan: "aptf2.jpg"},
                {title: "Studio Suite", beds: 1, baths: 1, size: "81.74 m²", img: "apt3.jpg", plan: "aptf3.jpg"},
                {title: "Modern Flat", beds: 2, baths: 2, size: "134.85 m²", img: "apt4.jpg", plan: "aptf4.jpg"},
                {title: "Urban Home", beds: 2, baths: 2, size: "111.37 m²", img: "apt5.jpg", plan: "aptf5.jpg"}
            ];
            
            listings.forEach((item, index) => {
                document.write(`
                    <div class="border p-4 shadow-lg">
                        <img src="${item.img}" class="w-full h-80 object-cover mb-4">
                        <h4 class="text-2xl font-bold mb-4">${item.title}</h4>
                        <div class="flex gap-4 mb-6 font-bold">
                            <span><i class="fas fa-bed"></i> ${item.beds}</span>
                            <span><i class="fas fa-bath"></i> ${item.baths}</span>
                            <span><i class="fas fa-expand"></i> ${item.size}</span>
                        </div>
                        <div class="flex gap-2 mb-4">
                            <a href="tel:0983796622" class="flex-1 bg-black text-white text-center py-2"><i class="fas fa-phone"></i></a>
                            <a href="https://wa.me/251983796622" class="flex-1 bg-green-600 text-white text-center py-2"><i class="fab fa-whatsapp"></i></a>
                            <a href="https://t.me/yosephab" class="flex-1 bg-blue-600 text-white text-center py-2"><i class="fab fa-telegram"></i></a>
                        </div>
                        <input type="checkbox" id="t-${index}" class="hidden detail-toggle-chk">
                        <label for="t-${index}" class="lbl-toggle-details">View Details</label>
                        <div class="expandable-details-content border-t mt-2">
                            <img src="${item.plan}" class="w-full">
                            <ul class="mt-4 text-sm space-y-2">
                                <li><i class="fas fa-check"></i> High-Speed Wi-Fi</li>
                                <li><i class="fas fa-check"></i> 24/7 Elevator</li>
                                <li><i class="fas fa-check"></i> Standby Generator</li>
                            </ul>
                        </div>
                    </div>
                `);
            });
        </script>
    </section>
</main>

<section id="gallery" class="p-20 bg-gray-50">
    <h2 class="text-5xl font-bold text-center mb-10 gold-text">Gallery</h2>
    <div class="grid md:grid-cols-3 gap-8">
        <video src="vid1.mp4" controls class="w-full shadow-lg"></video>
        <video src="vid2.mp4" controls class="w-full shadow-lg"></video>
        <video src="vid3.mp4" controls class="w-full shadow-lg"></video>
    </div>
</section>

<footer class="bg-[#0a1420] text-gray-300 p-10 text-center">
    <p>yosephab09@gmail.com | 0983796622</p>
</footer>

</body>
</html>
